<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burgos-Libros | Tienda</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <nav class="bg-white border-b-2 border-blue-600 p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <span class="text-xl font-bold text-blue-600">BURGOS-LIBROS</span>
      <div class="flex gap-4 items-center">
        <a href="index.html" class="text-blue-600 font-bold underline">Catálogo</a>
        <a href="admin.html" class="text-gray-600 hover:text-blue-600">Admin</a>
        
      </div>
    </div>
  </nav>


  <header class="relative bg-slate-700 text-white py-24 overflow-hidden">
    <img 
      src="img/principalbiblioteca.avif" 
      alt="Biblioteca Digital" 
      class="absolute inset-0 w-full h-full object-cover opacity-30"
    />


    <div class="mx-auto px-4 text-center">
      <h1 class="text-5xl font-bold mb-5">LA LECTURA ES PRIMERO</h1>
      <p class="text-blue-500 text-2xl">Vendemos Experiencias para las Futuras Generaciones.</p>
    </div>
  </header>




  <main class="max-w-6xl mx-auto px-4 py-12">
    <h2 class="text-2xl font-bold mb-8 border-b pb-2">Catálogo de Libros</h2>



    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      
      <div class="group bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100 hover:shadow-2xl hover:-translate-y-2 flex flex-col">
        <img src="img/HARRY.jpg" alt="Libro" class="w-full h-48 object-cover">
        <div class="p-4 text-center">
          <h3 class="font-bold text-gray-800">Harry Potter</h3>
          <p class="text-green-600 font-bold text-xl my-2">$9.99</p>
          <button class="w-full bg-blue-600 text-white py-2 font-bold rounded">Comprar</button>
        </div>
      </div>

      <div class="bg-white border border-gray-300 rounded shadow-sm">
        <img src="img/lirbo2.jpg" alt="Libro" class="w-full h-48 object-cover">
        <div class="p-4 text-center">
          <h3 class="font-bold text-gray-800">La historia Morante</h3>
          <p class="text-green-600 font-bold text-xl my-2">$19.00</p>
          <button class="w-full bg-blue-600 text-white py-2 font-bold rounded">Comprar</button>
        </div>
      </div>





      <div class="bg-gray-200 border border-gray-300 rounded opacity-70">
        <div class="relative">
          <img src="img/trigo.jpg" alt="Libro" class="w-full h-48 object-cover grayscale">
          <span class="absolute top-2 right-2 bg-red-600 text-white text-xs px-2 py-1 font-bold">AGOTADO</span>
        </div>
        <div class="p-4 text-center">
          <h3 class="font-bold text-gray-500">El trigo tierno</h3>
          <p class="text-gray-400 font-bold text-xl my-2">$15.00</p>
          <button disabled class="w-full bg-gray-400 text-white py-2 font-bold rounded cursor-not-allowed">Sin Stock</button>
        </div>
      </div>

      <div class="bg-white border border-gray-300 rounded shadow-sm">
        <img src="img/elogio.jpg" alt="Libro" class="w-full h-48 object-cover">
        <div class="p-4 text-center">
          <h3 class="font-bold text-gray-800">El elogio de la sombra</h3>
          <p class="text-green-600 font-bold text-xl my-2">$10.99</p>
          <button class="w-full bg-blue-600 text-white py-2 font-bold rounded">Comprar</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-gray-800 text-white py-6 mt-10">
    <div class="text-center text-sm text-gray-400">
      &copy; 2026 Burgos-Libros - Proyecto de Clase
    </div>
  </footer>

</body>
</html>
